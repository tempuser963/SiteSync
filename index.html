<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaryaSetu AI — Connecting Plans to Progress</title>
    <meta name="description" content="AI platform that ingests field execution data, correlates progress with L5/L6 schedules, detects contradictions, and builds historical execution memory." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f1729'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23d9261c' font-size='60' font-family='sans-serif' font-weight='bold'>◈</text></svg>" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('karyasetu_theme');
          if (!stored) {
            stored = localStorage.getItem('sitesync_theme');
            if (stored) {
              localStorage.setItem('karyasetu_theme', stored);
              localStorage.removeItem('sitesync_theme');
            }
          }
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-zinc-950 text-slate-800 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
